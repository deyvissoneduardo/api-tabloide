spring.application.name=api-tabloid
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/api_tabloid}
spring.datasource.username=${APP_DATASOURCE_USERNAME:api_tabloid}
spring.datasource.password=${APP_DATASOURCE_PASSWORD:api_tabloid}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:dev-only-secret-nao-usar-em-producao-troque-antes-do-deploy}
app.auth.sessao.duracao-maxima=PT8H
app.auth.sessao.tempo-inatividade=PT30M
app.auth.login.max-tentativas=5
app.auth.login.bloqueio-temporario=PT15M
app.auth.redefinicao-senha.validade=PT15M

app.public-base-url=${APP_PUBLIC_BASE_URL:https://tabloide.sgtm.example}
