services:
  postgres:
    image: postgres:16-alpine
    container_name: api-tabloid-postgres
    environment:
      POSTGRES_DB: api_tabloid
      POSTGRES_USER: api_tabloid
      POSTGRES_PASSWORD: api_tabloid
    ports:
      - "5432:5432"
    volumes:
      - api-tabloid-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_tabloid -d api_tabloid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api-tabloid-postgres-data:
